task: clm_training
experiment_name: test_clm_training_packing_smoke
verbose_level: 1
model_name: hf-internal-testing/tiny-random-LlamaForCausalLM
precision: bf16-true
seed: 42

dataset:
  source: local
  format: hf
  nameOrPath: output/tests/tokenized_doclevel
  packing:
    enabled: true
    sequence_length: 128
    tokenizer_name: hf-internal-testing/llama-tokenizer

validation_split:
  proportion: 0.1
  shuffle: true
  seed: 42

number_epochs: 1
batch_size: 1
num_workers: 0
validate_after_epoch: true
validate_on_end: true
validations_per_epoch: 1
save_on_validate: false
save_on_end: false
output_dir: output/tests

gradient_accumulation: false
gradient_accumulation_steps: 1
grad_clip: 1.0
lr: 2.0e-05
lr_decay: false
weight_decay: 0.0
beta1: 0.9
beta2: 0.95

lr_scheduler: fixed
warmup_proportion: 0.0

logging_config: none
parallelization_strategy: dp


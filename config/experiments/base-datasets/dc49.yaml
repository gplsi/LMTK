task: tokenization
experiment_name: tokenization_dc49_doclevel_salamandra2b
verbose_level: 3
seed: 42

tokenizer:
  tokenizer_name: BSC-LT/salamandra-2b
  task: clm_training
  # Doc-level mode: omit context_length/max_sequence_length and overlap.
  batch_size: 512
  num_proc: 1
  show_progress: true

dataset:
  source: local
  nameOrPath: data/downloaded/gplsi__discriminative_counterfeit_en/train.parquet
  format: files
  file_config:
    text_column: claim
    format: parquet
    encoding: utf-8
  filters:
    - column: label
      value: not-fake

output:
  path: data/tokenized/dc49_doclevel_salamandra2b

test_size: 0

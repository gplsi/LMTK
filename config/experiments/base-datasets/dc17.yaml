# Simple Dataset Merge Configuration
task: "dataset_merge"
experiment_name: "dc17_merged_dc8-dc16"
verbose_level: 3

# Fixed sequence length for all datasets
sequence_length: 2048

sequence_length_features:
  - input_ids
  - attention_mask
  - labels

required_features:
  - input_ids
  - attention_mask
  - labels

# Datasets to merge with their sampling percentages
datasets:
  - path: "data/tokenized/dc8"  # DC8
    percentage: 1.0  # 100% of this dataset
    name: "dc8"
  
  - path: "data/tokenized/dc9"  # Use DC9
    percentage: 1  # 100% of this dataset
    name: "dc9"

  - path: "data/tokenized/dc10"  # Use DC10
    percentage: 1  # 100% of this dataset
    name: "dc10"

  - path: "data/tokenized/dc11"  # Use DC11
    percentage: 1  # 100% of this dataset
    name: "dc11"
  
  - path: "data/tokenized/dc12"  # Use DC12
    percentage: 1  # 100% of this dataset
    name: "dc12"

  - path: "data/tokenized/dc13"  # Use DC13
    percentage: 1  # 100% of this dataset
    name: "dc13"

  - path: "data/tokenized/dc14"  # Use DC14
    percentage: 1  # 100% of this dataset
    name: "dc14"
  
  - path: "data/tokenized/dc15"  # Use DC15
    percentage: 1  # 100% of this dataset
    name: "dc15"

  - path: "data/tokenized/dc16"  # Use DC16
    percentage: 1  # 100% of this dataset
    name: "dc16"
  
# Output path for the merged dataset
output_path: "data/tokenized/dc17"

# Shuffling configuration
shuffle_seed: 42
final_shuffle_seed: 123

# Validation options
strict_compatibility: true

sampler:
  shuffle_full_sample: false
  indices_cache_dir: "tmp/dataset_merge_indices"

save:
  max_shard_size: "2GB"
  num_proc: 32

# Seed for reproducibility
seed: 42

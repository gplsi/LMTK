# Dataset Merge Configuration (dc30..dc38, 8k context tokenization without overlap)
task: "dataset_merge"
experiment_name: "dc39_merged_dc30-dc38"
verbose_level: 3

# Fixed sequence length for all datasets
sequence_length: 8192

sequence_length_features:
  - input_ids
  - attention_mask
  - labels

required_features:
  - input_ids
  - attention_mask
  - labels

# Datasets to merge with their sampling percentages
datasets:
  - path: "data/tokenized/dc30"
    percentage: 1.0
    name: "dc30"

  - path: "data/tokenized/dc31"
    percentage: 1.0
    name: "dc31"

  - path: "data/tokenized/dc32"
    percentage: 1.0
    name: "dc32"

  - path: "data/tokenized/dc33"
    percentage: 1.0
    name: "dc33"

  - path: "data/tokenized/dc34"
    percentage: 1.0
    name: "dc34"

  - path: "data/tokenized/dc35"
    percentage: 1.0
    name: "dc35"

  - path: "data/tokenized/dc36"
    percentage: 1.0
    name: "dc36"

  - path: "data/tokenized/dc37"
    percentage: 1.0
    name: "dc37"

  - path: "data/tokenized/dc38"
    percentage: 1.0
    name: "dc38"

# Output path for the merged dataset
output_path: "data/tokenized/dc39"

# Shuffling configuration
shuffle_seed: 42
final_shuffle_seed: 123

# Validation options
strict_compatibility: true

sampler:
  shuffle_full_sample: false
  indices_cache_dir: "tmp/dataset_merge_indices"

save:
  max_shard_size: "2GB"
  num_proc: 32

# Seed for reproducibility
seed: 42

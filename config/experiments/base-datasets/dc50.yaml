task: tokenization
experiment_name: tokenization_dc50
verbose_level: 3
seed: 42

tokenizer:
  tokenizer_name: /leonardo_work/EUHPC_D22_034/models/tokenizers/BSC-LT__salamandra-2b
  task: clm_training
  # Doc-level mode: omit context_length/max_sequence_length and overlap.
  batch_size: 512
  num_proc: 1
  show_progress: true

dataset:
  source: local
  nameOrPath: /leonardo_scratch/fast/EUHPC_D22_034/data/downloaded/gplsi__discriminative_counterfeit_es/train.parquet
  format: files
  file_config:
    text_column: claim
    format: parquet
    encoding: utf-8
  filters:
    - column: label
      value: not-fake

output:
  path: /leonardo_scratch/fast/EUHPC_D22_034/data/tokenized/dc50/

test_size: 0

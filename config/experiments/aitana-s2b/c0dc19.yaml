# Mirroring c0dc1 settings to train salamandra-2b on dataset dc19

task: "clm_training"
experiment_name: "aitana-s2b-c0dc19"
verbose_level: 4

# Training data
dataset:
  source: "local"  # huggingface, local
  nameOrPath: "/home/gplsi/GPLSI/ALIA/modelos/Continual/data/dc19"
  format: "hf"

validation_split:
  proportion: 0.01
  seed: 42
  shuffle: true

# Output dir
output_dir: "output/aitana-s2b-c0dc19"
seed: 42

# Model
model_name: "BSC-LT/salamandra-2b"

# Model precision
precision: "bf16-true"
static_graph: false

# Training parameters
number_epochs: 1
batch_size: 2

# Validation parameters
validations_per_epoch: 4
validate_after_epoch: false
validate_after_k_steps: null
validate_on_end: true

# Saving checkpoints
save_on_validate: true
save_on_end: true

# Gradient parameters
gradient_accumulation: true
gradient_accumulation_steps: 8
grad_clip: 1.0

# Optimizer parameters
lr: 0.00002      
lr_decay: true
weight_decay: 0.01
beta1: 0.9
beta2: 0.999

# Scheduler parameters
lr_scheduler: "warmup_linear"
warmup_proportion: 0.06   

# Logging
logging_config: "wandb"

# Wandb logging specific parameters
wandb_project: "salamandra-2b_fsdp__allen-md-anonymized"
wandb_entity: "gplsi_continual"
wandb_run_name: "aitana-s2b-c0dc19"
wandb_group: "aitana-s2b"
wandb_job_type: "train"
wandb_tags:
  - "dc19"
  - "fsdp"
  - "bf16"
  - "continual"
wandb_notes: "Continual CLM training on dc19 with Salamandra-2B"
wandb_resume: "allow"
wandb_mode: "online"
log_model: false
log_iter_interval: 10

# Distributed_strategy
parallelization_strategy: "fsdp"

# FSDP specific parameters
auto_wrap_policy: "llama"
sharding_strategy: "FULL_SHARD"
state_dict_type: "sharded"
limit_all_gathers: true
cpu_offload: false
num_workers: 4
gradient_checkpointing: true
# Mirroring c0dc1 settings to train salamandra-2b on dataset dc7

task: "clm_training"
experiment_name: "aitana-s2b-c0dc17"
verbose_level: 4

# Training data
dataset:
  source: "local"  # huggingface, local
  nameOrPath: "/leonardo_scratch/fast/EUHPC_D22_034/data/tokenized/dc17"
  format: "hf"

validation_split:
  proportion: 0.005
  seed: 42
  shuffle: true

# Output dir
output_dir: "output/aitana-s2b-c0dc17"
seed: 42

# Model
model_name: "/leonardo_work/EUHPC_D22_034/models/models--BSC-LT--salamandra-2b/snapshots/d3d9761818cd5477ab5ec55543087fc304c30f9a"

# Model precision
precision: "bf16-true"
static_graph: false

# Training parameters
number_epochs: 1
batch_size: 2

# Validation parameters
validate_on_end: true
validate_after_epoch: false
validate_after_k_steps: null
validations_per_epoch: 5

# Saving checkpoints
save_on_validate: true
save_on_end: true

# Gradient parameters
gradient_accumulation: true
gradient_accumulation_steps: 8
grad_clip: 1.0

# Optimizer parameters
lr: 0.00002      
lr_decay: true
weight_decay: 0.01
beta1: 0.9
beta2: 0.999

# Scheduler parameters
lr_scheduler: "warmup_linear"
warmup_proportion: 0.06   

# Logging
logging_config: "wandb"

# Wandb logging specific parameters
wandb_project: "salamandra-2b_fsdp__allen-md-anonymized"
wandb_entity: "gplsi_continual"
wandb_run_name: "aitana-s2b-c0dc17"
wandb_group: "aitana-s2b"
wandb_job_type: "train"
wandb_tags:
  - "dc17"
  - "fsdp"
  - "bf16"
  - "continual"
wandb_notes: "Continual CLM training on dc17 with Salamandra-2B"
wandb_resume: "allow"
wandb_mode: "offline"
log_model: false
log_iter_interval: 10

# Distributed_strategy
parallelization_strategy: "ddp"
num_workers: 4
cpu_offload: false
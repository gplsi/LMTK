# Mirroring c0dc1 settings to train salamandra-2b on dataset dc7

task: "clm_training"
experiment_name: "aitana-s2b-c0dc7"
verbose_level: 3

# Training data
dataset:
  source: "local"  # huggingface, local
  nameOrPath: "/leonardo_scratch/fast/EUHPC_D22_034/data/tokenized/dc7"
  format: "hf"

validation_split:
  proportion: 0.01
  seed: 42
  shuffle: true

#Resume Training from Checkpoint
checkpoint: "/leonardo_scratch/large/userexternal/sgaliano/output/aitana-s2b-c0dc7/e-001-gs-004233.pth"

# Output dir
output_dir: "/leonardo_scratch/large/userexternal/sgaliano/output/aitana-s2b-c0dc7"
seed: 42

# Model (resume from converted checkpoint instead of downloading Salamandra)
model_name: "/leonardo_scratch/large/userexternal/sgaliano/output/Aitana-2b-c0dc17/e-002-gs-075502"

# Model precision
precision: "bf16-true"
static_graph: false

# Training parameters
number_epochs: 2
batch_size: 2

# Validation parameters
validate_on_end: false
validate_after_epoch: false
validate_after_k_steps: null
validations_per_epoch: 8

# Saving checkpoints
save_on_validate: false
save_on_end: true
checkpoints_per_epoch: 2

# Gradient parameters
gradient_accumulation: true
gradient_accumulation_steps: 8
grad_clip: 1.0

# Optimizer parameters
lr: 0.000005
lr_decay: true
weight_decay: 0.01
beta1: 0.9
beta2: 0.999

# Scheduler parameters
lr_scheduler: "warmup_linear"
warmup_proportion: 0.01   

# Logging
logging_config: "wandb"

# Wandb logging specific parameters
wandb_project: "aitana-s2b-c0dc7"
wandb_entity: "gplsi_continual"
wandb_run_name: "aitana-s2b-c0dc7"
wandb_group: "aitana-s2b"
wandb_job_type: "train"
wandb_tags:
  - "dc7"
  - "fsdp"
  - "bf16"
  - "continual"
wandb_notes: "Continual CLM training on dc7 with Salamandra-2B"
wandb_resume: "allow"
wandb_mode: "offline"
log_model: false
log_iter_interval: 10

# Distributed_strategy
parallelization_strategy: "ddp"
num_workers: 4
cpu_offload: false

# Multi-node FSDP mixture training config for dc40 (doc-level tokenized dataset).
#
# IMPORTANT (SLURM):
# - `num_nodes` must match `slurm/submit_job.sh --nodes`
# - `devices_per_node` must match `slurm/submit_job.sh --ntasks-per-node`
# - Pass `-g/--gpus` equal to GPUs per node (typically same as `devices_per_node`)
#
# Note (mixture budget):
# - `anchor_epochs: 1` can be very large (one full anchor epoch of packed blocks).
# - Packing mode enforces `len(train_dataloader) % gradient_accumulation_steps == 0`.
#   If this fails, switch to `budget_mode: explicit_blocks` and set `total_blocks` to a
#   multiple of `world_size * gradient_accumulation_steps` (= 8 * 16 = 128).

task: "clm_training"
experiment_name: "aitana-s2b-c0dc40"
verbose_level: 3
seed: 42

# Output dir (shared filesystem for multi-node)
output_dir: "/leonardo_scratch/large/userexternal/sgaliano/output/aitana-2b-c0dc40-issues42-43"

# Model
model_name: "/leonardo_work/EUHPC_D22_034/models/models--BSC-LT--salamandra-2b/snapshots/d3d9761818cd5477ab5ec55543087fc304c30f9a"
precision: "bf16-true"

# Multi-node settings (must match SLURM allocation)
num_nodes: 2
devices_per_node: 4

# Training parameters (match c0dc29 effective global batch: 1 * 8 * 16 = 128)
number_epochs: 1
batch_size: 1
num_workers: 4

# Mixture source (single source; still uses mixture path for issue-43 coverage)
dataset:
  source: "local"
  format: "hf"
  sources:
    - dataset_id: "dc40"
      nameOrPath: "/leonardo_scratch/fast/EUHPC_D22_034/data/tokenized/dc40_doclevel_salamandra2b"
      tokenizer_name: "BSC-LT/salamandra-2b"
      index_cache_dir: "/leonardo_scratch/large/userexternal/sgaliano/output/aitana-2b-c0dc40-issues42-43/packing_index/dc40"
  packing:
    enabled: true
    sequence_length: 8192
    tokenizer_name: "BSC-LT/salamandra-2b"
    shuffle: true
    sampler_drop_last: true
    drop_last_batch: true
  mixture:
    enabled: true
    budget_mode: "anchor_epochs"
    anchor_epochs: 1
    schedule_seed: 42

validation_split:
  proportion: 0.01
  seed: 42
  shuffle: true

# Validation / checkpointing
validations_per_epoch: 4
validate_after_epoch: false
validate_after_k_steps: null
validate_on_end: true
save_on_validate: true
save_on_end: true

# Optimizer
gradient_accumulation: true
gradient_accumulation_steps: 16
grad_clip: 1.0
lr: 2.0e-05
lr_decay: true
weight_decay: 0.01
beta1: 0.9
beta2: 0.999

# Scheduler (bounded peak, min_lr left at 0.0)
lr_scheduler: "warmup_linear"
warmup_proportion: 0.06
min_lr: 0.0
max_lr: 2.0e-05

# Distributed strategy
parallelization_strategy: "fsdp"
parallelization_config:
  auto_wrap_policy: "llama"
  sharding_strategy: "FULL_SHARD"
  state_dict_type: "sharded"
  limit_all_gathers: true
  cpu_offload: false
  gradient_checkpointing: true

# Logging: always writes CSV logs; set logging_config: wandb to enable WandB
log_iter_interval: 10


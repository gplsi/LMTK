task: "clm_training"
experiment_name: "salamandra2b-bench-continual"
verbose_level: 3

# Training data
dataset:
  source: "local"
  nameOrPath: "/leonardo_scratch/fast/EUHPC_D22_034/data/tokenized/dc6-salamandra-2b"
  #nameOrPath: "/workspace/data/tokenized/anonymized-va-bench"
  format: "hf"

# Output dir
output_dir: "output/salamadnra-2b-test_llama-bench/"
precision: "bf16-true"
# Model
model_name: "/leonardo_work/EUHPC_D22_034/models/models--BSC-LT--salamandra-2b/snapshots/d3d9761818cd5477ab5ec55543087fc304c30f9a"
#"meta-llama/Llama-3.2-3B"

# Model precision
static_graph: false

# Training parameters
number_epochs: 1
batch_size: 3
gradient_accumulation: true
gradient_accumulation_steps: 4
grad_clip: 1.0

# Optimizer parameters
lr: 0.00002      
lr_decay: true
weight_decay: 0.01
beta1: 0.9
beta2: 0.999


# Scheduler parameters
lr_scheduler: "cosine"
warmup_proportion: 0

# Validation and checkpoint saving parameters
validations_per_epoch: 1
validate_after_epoch: false
validate_on_end: false
save_on_end: false
save_on_validate: false


# Distributed_strategy
parallelization_strategy: "ddp"

num_workers: 4

#logging specific parameters
logging_config: none
log_model: false
log_iter_interval: 10


seed: 42

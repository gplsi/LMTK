# Mirroring c0dc1 settings to train salamandra-2b on dataset dc7

task: "clm_training"
experiment_name: "llama_3.2_3b_semantic_all_8192_con_n_top10_e2"
verbose_level: 3

# Training data
dataset:
  source: "local"  # huggingface, local
  nameOrPath: "/home/gplsi/mikel/scripts4/lmtk_decoders/LMTK/data/owl/tokenized_outputs/random_10vol_selection_matonto_10_randoms_max40_overlap_bien_filtrado_01_small"
  format: "hf"

validation_split:
  proportion: 0.01
  seed: 42
  shuffle: true

# Output dir
output_dir: "output/random_10vol_selection_matonto_10_randoms_max40_overlap_bien_filtrado_01_small_v1"
seed: 42

# Model
model_name: "meta-llama/Llama-3.2-3B"

# Model precision
precision: "bf16-true"
static_graph: false

# Training parameters
number_epochs: 1
batch_size: 1

# Validation parameters
validate_on_end: true
validate_after_epoch: true
validate_after_k_steps: null


# Saving checkpoints
save_on_validate: true
save_on_end: true

# Gradient parameters
gradient_accumulation: true
gradient_accumulation_steps: 16
grad_clip: 1.0

# Optimizer parameters
lr: 0.00002      
lr_decay: true
weight_decay: 0.01
beta1: 0.9
beta2: 0.999

# Scheduler parameters
lr_scheduler: "warmup_linear"
warmup_proportion: 0.1   

# Logging
logging_config: "wandb"

# Wandb logging specific parameters
wandb_project: "llama_3.2_3b_df_all_8192"
wandb_entity: "gplsi_continual"
wandb_run_name: "llama_3.2_3b_df_all_8192"
wandb_group: "aitana-s2b"
wandb_job_type: "train"
wandb_tags:
  - "dc7"
  - "fsdp"
  - "bf16"
  - "continual"
wandb_notes: "Llama 3.2-3B CLM training on dbpedia_cleaned_matonto_txt_one_line with fixed validation slice"
wandb_resume: "allow"
wandb_mode: "online"
log_model: false
log_iter_interval: 10

# Distributed_strategy
parallelization_strategy: "fsdp"

# Training specific parameters
# cpu_offload: false
# num_workers: 0
# gradient_checkpointing: true

# auto_wrap_policy: "llama"
sharding_strategy: "FULL_SHARD"
state_dict_type: "sharded"
limit_all_gathers: true
cpu_offload: false
num_workers: 4
gradient_checkpointing: true

# strict_determinism: false
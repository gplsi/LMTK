# Example configuration for CLM training with multi-node FSDP strategy
# This demonstrates the multi-node fields in the training args schema

task: "clm_training"
experiment_name: "clm-multinode-fsdp-example"
verbose_level: 2

# Data configuration
dataset:
  source: local
  nameOrPath: "/workspace/data/tokenized_outputs/clm_testing"
  format: "hf"

# Model configuration
model_name: "meta-llama/Meta-Llama-3-8B"
precision: "bf16-true"

# Training arguments
number_epochs: 1
batch_size: 2
num_nodes: 2
devices_per_node: 4
num_workers: 4
validate_after_epoch: true
validate_on_end: true
save_on_validate: false
save_on_end: false
output_dir: "/workspace/output/clm_fsdp_multinode_example"

# Optimizer configuration
gradient_accumulation: true
gradient_accumulation_steps: 8
grad_clip: 1.0
lr: 0.00002
lr_decay: true
weight_decay: 0.01
beta1: 0.9
beta2: 0.95

# Scheduler configuration
lr_scheduler: "warmup_linear"
warmup_proportion: 0.06

# Parallelization strategy
parallelization_strategy: "fsdp"
parallelization_config:
  auto_wrap_policy: "llama"
  sharding_strategy: "FULL_SHARD"
  state_dict_type: "full"
  limit_all_gathers: true
  cpu_offload: false
  gradient_checkpointing: true

# Logging configuration
logging_config: "wandb"

# Seed for reproducibility
seed: 42

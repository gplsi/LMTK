$schema: "http://json-schema.org/draft-07/schema#"
$id: "dataset_merge.schema.yaml"
description: "Schema for dataset merge task configuration"

allOf:
  - $ref: "base.schema.yaml"
  - type: object
    properties:
      
      # Task-specific properties
      datasets:
        type: array
        minItems: 2
        description: "List of datasets to merge with their sampling percentages"
        items:
          type: object
          properties:
            path:
              type: string
              description: "Path to the tokenized dataset directory"
            percentage:
              type: number
              minimum: 0.01
              maximum: 10.0
              description: "Percentage of data to sample from this dataset (1.0 = 100%, can exceed 1.0 for oversampling)"
            name:
              type: string
              description: "Optional human-readable name for this dataset"
          required:
            - path
            - percentage

      # Output configuration
      output_path:
        type: string
        description: "Path where the merged dataset will be saved"

      save:
        type: object
        description: "Options controlling how the merged dataset is written to disk"
        properties:
          max_shard_size:
            type: [string, number, 'null']
            description: "Maximum shard size passed to Hugging Face save_to_disk"
          num_shards:
            type: [integer, 'null']
            minimum: 1
            description: "Fixed number of shards for save_to_disk"
          num_proc:
            type: [integer, 'null']
            minimum: 1
            description: "Number of processes to use while saving"
        additionalProperties: false

      # Shuffling configuration
      shuffle_seed:
        type: [integer, 'null']
        default: null
        description: "Seed for shuffling datasets before sampling (null for random)"

      final_shuffle_seed:
        type: [integer, 'null'] 
        default: null
        description: "Seed for final shuffle after merging (null for random)"

      # Validation options
      strict_compatibility:
        type: boolean
        default: true
        description: "Whether to enforce strict compatibility checking between datasets"

      required_features:
        type: array
        description: "List of feature names that must exist on every dataset"
        items:
          type: string

      feature_length_constraints:
        type: object
        description: "Expected fixed sequence length for specific features"
        additionalProperties:
          type: integer
          minimum: 1

      sequence_length:
        type: [integer, 'null']
        minimum: 1
        description: "Expected fixed sequence length shared across token features"

      sequence_length_features:
        type: array
        description: "Feature names to which sequence_length applies"
        items:
          type: string

      sampler:
        type: object
        description: "Sampler behaviour overrides"
        properties:
          shuffle_full_sample:
            type: boolean
            description: "When true, datasets sampled at 100% are still shuffled"
          indices_cache_dir:
            type: string
            description: "Directory where shuffle index cache files are stored"
        additionalProperties: false

      # Allow base schema properties
      seed:
        type: [integer, 'null']
        default: null
        description: "Random seed for reproducibility"

    required:
      - datasets
      - output_path

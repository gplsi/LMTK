$schema: "http://json-schema.org/draft-07/schema#"
$id: "scheduler.schema.yaml"
description: "Schema for learning rate scheduler configuration"

type: object
properties:
  lr_scheduler:
    type: string
    default: "linear"
    enum: ["fixed", "warmup_linear", "warmup_constant", "cosine", "warmup_cosine", "warmup_cosine_restart"]
    description: "Learning rate scheduler to use"

  warmup_proportion:
    type: number
    default: 0.06
    description: "Proportion of training steps to warm up the learning rate"

  min_lr:
    type: number
    minimum: 0
    default: 0.0
    description: "Lower learning-rate bound. Warmup starts from this value and decays are clamped to stay above it."

  max_lr:
    type: [number, "null"]
    minimum: 0
    default: null
    description: "Optional peak learning rate. When null, the optimizer lr value is used as peak."

required:
  - lr_scheduler
  - warmup_proportion

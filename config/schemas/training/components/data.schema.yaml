$schema: "http://json-schema.org/draft-07/schema#"
$id: "data.schema.yaml"
description: "Schema for dataset configuration"

type: object
properties:
  dataset:
    type: object
    properties:
      source:
        type: string
        enum: ["huggingface", "local"]
        description: "Source of the dataset"
      nameOrPath:
        type: string
        description: "Dataset name for HuggingFace or local path"
      sources:
        type: array
        minItems: 1
        uniqueItems: true
        description: "Optional multi-source dataset configuration for mixture training."
        items:
          type: object
          additionalProperties: false
          properties:
            dataset_id:
              type: string
              minLength: 1
              description: "Stable source identifier used for reporting and deterministic allocation."
            nameOrPath:
              type: string
              description: "Dataset local path for this source."
            weight:
              type: [number, "null"]
              exclusiveMinimum: 0
              description: "Optional source weight (>0). In mixture mode, set for all sources or omit for all."
            tokenizer_name:
              type: [string, "null"]
              description: "Optional tokenizer compatibility metadata for fail-fast checks."
            eos_token_id:
              type: [integer, "null"]
              minimum: 0
              description: "Optional EOS compatibility metadata for fail-fast checks."
            index_cache_dir:
              type: [string, "null"]
              description: "Optional source-specific index cache directory."
          required:
            - dataset_id
            - nameOrPath
      mixture:
        type: object
        description: "Mixture scheduling and budget controls for dataset.sources mode."
        additionalProperties: false
        properties:
          enabled:
            type: boolean
            description: "Must be true when dataset.sources is used."
          budget_mode:
            type: string
            enum: ["anchor_epochs", "explicit_blocks"]
            default: "anchor_epochs"
          alignment_policy:
            type: [string, "null"]
            enum: ["error", "floor", "ceil", null]
            description: "Budget alignment policy. Defaults in code to 'floor' for anchor_epochs and 'error' for explicit_blocks."
          anchor_epochs:
            type: integer
            minimum: 1
          anchor_dataset_id:
            type: [string, "null"]
          total_blocks:
            type: integer
            minimum: 1
          schedule_seed:
            type: [integer, "null"]
          report_path:
            type: [string, "null"]
      format:
        type: string
        enum: ["dataset", "files", "hf"]
        description: "Format of the dataset"
        default: "hf"
      packing:
        type: object
        description: "Optional training-time packing configuration for doc-level tokenized datasets."
        properties:
          enabled:
            type: boolean
            default: false
          sequence_length:
            type: integer
            minimum: 1
            description: "Fixed packed sequence length (model context window). Required when enabled is true."
          insert_eos:
            type: [boolean, "null"]
            description: "Whether to append one EOS after each document (unless already present). Defaults in code to true."
          tokenizer_name:
            type: [string, "null"]
            description: "Tokenizer name used to resolve eos_token_id when insert_eos is true and eos_token_id is not provided."
          eos_token_id:
            type: [integer, "null"]
            minimum: 0
            description: "Explicit EOS token id to use when insert_eos is true."
          shuffle:
            type: [boolean, "null"]
            description: "Whether to shuffle packed blocks via the sampler. Defaults in code to true for train split and false otherwise."
          sampler_drop_last:
            type: [boolean, "null"]
            description: "Whether to drop tail blocks per rank to avoid sampler padding/duplication. Defaults in code to true when world_size > 1."
          drop_last_batch:
            type: [boolean, "null"]
            description: "Whether to drop the final partial batch from the DataLoader. Defaults in code to true for train split in distributed runs and false otherwise."
          index_cache_dir:
            type: [string, "null"]
            description: "Optional directory to store/reuse the persisted packing index. Defaults in code to <dataset.nameOrPath>/.packing_index."
          lock_timeout_s:
            type: [integer, "null"]
            minimum: 1
            description: "Seconds to wait for the per-split packing index LOCK before failing. Defaults in code to 1800."
          stale_lock_age_s:
            type: [integer, "null"]
            minimum: 1
            description: "If set, a lock lease with no heartbeat update for this many seconds is treated as stale and removed before retrying. Default null (never auto-break)."
          lock_lease_heartbeat_s:
            type: [integer, "null"]
            minimum: 1
            description: "Seconds between lock lease heartbeats while building an index. Defaults in code to 30."
          clean_index_cache_on_start:
            type: boolean
            default: false
            description: "If true, removes <index_cache_dir>/v<version>/ before building so indexes are rebuilt from scratch."
          clean_index_cache_on_success:
            type: boolean
            default: false
            description: "If true, removes <index_cache_dir>/v<version>/ after successful training to avoid disk bloat."
          allow_shared_cache_cleanup:
            type: boolean
            default: false
            description: "If true, allows cleanup of cache dirs outside output_dir (shared caches). Use with caution when multiple jobs may run concurrently."
        additionalProperties: false
    allOf:
      - oneOf:
          - required: ["nameOrPath"]
            not:
              required: ["sources"]
          - required: ["sources", "mixture"]
            not:
              required: ["nameOrPath"]
      - if:
          required: ["packing"]
          properties:
            packing:
              type: object
              properties:
                enabled:
                  const: true
        then:
          required: ["packing"]
          properties:
            packing:
              required: ["sequence_length"]
      - if:
          required: ["sources"]
        then:
          required: ["mixture"]
          properties:
            mixture:
              required: ["enabled"]
              properties:
                enabled:
                  const: true
      - if:
          required: ["mixture"]
        then:
          required: ["sources"]
      - if:
          required: ["mixture"]
          properties:
            mixture:
              type: object
              properties:
                budget_mode:
                  const: "anchor_epochs"
        then:
          properties:
            mixture:
              required: ["anchor_epochs"]
      - if:
          required: ["mixture"]
          properties:
            mixture:
              type: object
              not:
                required: ["budget_mode"]
        then:
          properties:
            mixture:
              required: ["anchor_epochs"]
      - if:
          required: ["mixture"]
          properties:
            mixture:
              type: object
              properties:
                budget_mode:
                  const: "explicit_blocks"
              required: ["budget_mode"]
        then:
          properties:
            mixture:
              required: ["total_blocks"]
    required:
      - source
  validation_split:
    type: object
    additionalProperties: false
    description: "Configuration for creating a validation split when the dataset does not provide one."
    properties:
      proportion:
        type: number
        exclusiveMinimum: 0
        exclusiveMaximum: 1
        description: "Fraction of the training data to reserve for validation (0-1)."
      count:
        type: integer
        minimum: 1
        description: "Fixed number of training examples to reserve for validation."
      seed:
        type: integer
        minimum: 0
        description: "Random seed used when shuffling before splitting."
      shuffle:
        type: boolean
        default: true
        description: "Whether to shuffle the training data before creating the validation split."
    anyOf:
      - required: ["proportion"]
      - required: ["count"]

required:
  - dataset

$schema: "http://json-schema.org/draft-07/schema#"
$id: "data.schema.yaml"
description: "Schema for dataset configuration"

type: object
properties:
  dataset:
    type: object
    properties:
      source:
        type: string
        enum: ["huggingface", "local"]
        description: "Source of the dataset"
      nameOrPath:
        type: string
        description: "Dataset name for HuggingFace or local path"
      format:
        type: string
        enum: ["dataset", "files", "hf"]
        description: "Format of the dataset"
        default: "hf"
      packing:
        type: object
        description: "Optional training-time packing configuration for CLM (doc-level tokens -> fixed-length blocks)."
        properties:
          enabled:
            type: boolean
            description: "Enable training-time packing."
          sequence_length:
            type: integer
            minimum: 1
            description: "Fixed block length produced by packing."
          insert_eos:
            type: boolean
            description: "Insert eos_token_id between documents (and at document ends when missing)."
          eos_token_id:
            type: [integer, "null"]
            description: "EOS token id to insert when insert_eos is true."
          tokenizer_name:
            type: string
            description: "Tokenizer name used to resolve eos_token_id when not provided directly."
          shuffle:
            type: boolean
            description: "Shuffle packed blocks for the train split (implemented via sampler)."
          sampler_drop_last:
            type: boolean
            description: "In DDP, drop remainder blocks instead of duplicating samples across ranks."
        allOf:
          - if:
              properties:
                enabled:
                  const: true
            then:
              required: ["sequence_length"]
    required:
      - source
      - nameOrPath
  validation_split:
    type: object
    additionalProperties: false
    description: "Configuration for creating a validation split when the dataset does not provide one."
    properties:
      proportion:
        type: number
        exclusiveMinimum: 0
        exclusiveMaximum: 1
        description: "Fraction of the training data to reserve for validation (0-1)."
      count:
        type: integer
        minimum: 1
        description: "Fixed number of training examples to reserve for validation."
      seed:
        type: integer
        minimum: 0
        description: "Random seed used when shuffling before splitting."
      shuffle:
        type: boolean
        default: true
        description: "Whether to shuffle the training data before creating the validation split."
    anyOf:
      - required: ["proportion"]
      - required: ["count"]

required:
  - dataset

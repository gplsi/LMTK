$schema: "http://json-schema.org/draft-07/schema#"
$id: "clm_training.fsdp.schema.yaml"
description: "Schema for FSDP experiments"

allOf:
  - $ref: "../../base.schema.yaml"
  - type: object
    
    properties:

      wandb_entity:
        type: string
        default: none
        description: "Wandb entity to log the experiment"

      wandb_project:
        type: string
        default: none
        description: "Wandb project to log the experiment"

      wandb_run_name:
        type: string
        default: none
        description: "Wandb run name for the experiment (optional, auto-generated if not provided)"

      wandb_group:
        type: string
        description: "Optional WandB group for aggregating related runs"

      wandb_job_type:
        type: string
        description: "Job type label shown in WandB UI"

      wandb_tags:
        anyOf:
          - type: array
            items:
              type: string
          - type: string
        description: "List of tags (or a single tag) to attach to the run"

      wandb_notes:
        type: string
        description: "Long-form notes to attach to the run"

      wandb_mode:
        type: string
        enum: ["online", "offline", "disabled"]
        description: "WandB logging mode"

      wandb_id:
        type: string
        description: "Explicit WandB run ID (useful for resuming)"

      wandb_resume:
        type: string
        enum: ["allow", "never", "must"]
        default: "allow"
        description: "Resume behavior when a run ID already exists"

      log_model:
        type: boolean
        default: false
        description: "If True, log the model to wandb"

      log_iter_interval:
        type: integer
        default: 100
        description: "Interval to log metrics to wandb and print in terminal"
      
    
    required:
    - wandb_entity
    - wandb_project
    - log_model
    - log_iter_interval
